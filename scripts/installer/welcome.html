  <h1>Install UnZip</h1>
  <p>UnZip is a macOS app for opening ZIP, RAR, ISO, TAR, 7Z, and DMG files, and for compressing folders and files.</p>
  <p>This installer copies UnZip to <b>Applications</b> and registers the Finder service <b>Zip with UnZip</b>.</p>
  <p>Requires macOS 14 or later. Works on Apple Silicon and Intel Macs.</p>
